name: Release

# Fires only when a PR targeting main is actually merged (not just closed).
# A direct push to main - e.g. state.json's own "Update seen parcels"
# commits, made straight to main by the pipeline itself via the GitHub
# Contents API - never goes through a PR, so it never triggers this.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # Determines the next semver version from Conventional Commits
      # (feat -> minor, fix -> patch, "BREAKING CHANGE"/"!" -> major, chore/
      # docs/refactor/etc. -> no release) since the last tag, bumps
      # src/skip_tracer/__init__.py's __version__ (see pyproject.toml),
      # updates CHANGELOG.md, and creates the git tag + GitHub Release.
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
